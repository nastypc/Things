name: Build Windows EXE with Tesseract

on:
  push:
    branches: [ master, main ]
    paths:
      - 'Script/CDT/Mouse/Shift + Hover/Convert.py'
      - 'Script/CDT/Mouse/Shift + Hover/requirements.txt'
      - 'Script/CDT/Mouse/Shift + Hover/.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Tesseract OCR
      run: |
        choco install tesseract -y
        echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
    - name: Install Python dependencies
      run: |
        cd "Script/CDT/Mouse/Shift + Hover"
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build EXE with PyInstaller
      run: |
        cd "Script/CDT/Mouse/Shift + Hover"
        pyinstaller --onefile --windowed --name "ShiftHoverConverter" --icon=NONE Convert.py
        
    - name: Create Portable Package
      run: |
        cd "Script/CDT/Mouse/Shift + Hover"
        New-Item -ItemType Directory -Force -Path "Portable\Tesseract-OCR"
        Copy-Item "C:\Program Files\Tesseract-OCR\*" -Destination "Portable\Tesseract-OCR\" -Recurse -Force
        Copy-Item "dist\ShiftHoverConverter.exe" -Destination "Portable\" -Force
        
    - name: Create README for portable package
      run: |
        cd "Script/CDT/Mouse/Shift + Hover"
        @"
        ===================================================
           Shift+Hover MM-to-Imperial Converter - PORTABLE
        ===================================================
        
        QUICK START:
        1. Extract this entire folder anywhere on your computer
        2. Double-click "ShiftHoverConverter.exe"
        3. Look for the cyan "AU" system tray icon (bottom-right)
        
        USAGE:
        - Ctrl+Shift + Hover mouse = Shows instant mm-to-imperial tooltip
        - Ctrl+Alt+H = Open conversion history window
        - Double-click any history entry = Batch replace that value in P2.CDT
        - Right-click history entry = Restore original value
        - Ctrl+Alt+T = Toggle tooltip on/off
        - Right-click tray icon = Exit
        
        FEATURES:
        ✓ OCR captures mm values from any window
        ✓ Real-time imperial conversion tooltips
        ✓ Color-coded history (green=original, red=modified)
        ✓ Batch find/replace in CDT files
        ✓ Restore original values anytime
        ✓ Works with Randek Viewer and CAD software
        
        PORTABLE:
        - No installation required
        - Tesseract OCR included (no separate install needed)
        - Copy to USB drive or network share
        - Works on any Windows PC
        
        REQUIREMENTS:
        - Windows 10/11
        - CDT files (P2.CDT or P1.CDT in workspace)
        
        NOTES:
        - Randek Viewer doesn't auto-refresh - close and reopen file to see changes
        - Values are replaced as whole numbers (6096.0 → 6096)
        - Uses regex word boundaries for accurate replacement
        
        Built: $(Get-Date -Format "yyyy-MM-dd HH:mm")
        "@ | Out-File -FilePath "Portable\README.txt" -Encoding utf8
        
    - name: Create ZIP archive
      run: |
        cd "Script/CDT/Mouse/Shift + Hover"
        Compress-Archive -Path "Portable\*" -DestinationPath "shift-hover-converter-windows.zip" -Force
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: shift-hover-converter-windows
        path: Script/CDT/Mouse/Shift + Hover/shift-hover-converter-windows.zip
        retention-days: 90
