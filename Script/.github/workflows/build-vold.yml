name: Build Vold Windows Executable

on:
  push:
    branches: [ master ]
    paths:
      - 'Script/Vold.py'
      - 'Script/Vold.spec'
      - 'Script/.github/workflows/build-vold.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      working-directory: Script
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        
    - name: Create dummy JSON files if they don't exist
      working-directory: Script
      run: |
        if (-not (Test-Path "gui_zones_state.json")) { 
          '{}' | Out-File -FilePath "gui_zones_state.json" -Encoding utf8
        }
        if (-not (Test-Path "gui_zones_last_folder.json")) { 
          '{}' | Out-File -FilePath "gui_zones_last_folder.json" -Encoding utf8
        }
        if (-not (Test-Path "gui_zones_log.json")) { 
          '{}' | Out-File -FilePath "gui_zones_log.json" -Encoding utf8
        }
        
    - name: Build with PyInstaller
      working-directory: Script
      run: |
        pyinstaller Vold.spec
        
    - name: Verify build
      working-directory: Script
      run: |
        if (Test-Path "dist\Vold.exe") {
          Write-Host "✓ Build successful!"
          Write-Host "File size: $((Get-Item 'dist\Vold.exe').Length / 1MB) MB"
        } else {
          Write-Error "Build failed - Vold.exe not found"
          exit 1
        }
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vold-windows
        path: Script/dist/Vold.exe
        retention-days: 90
