name: Build Mouse Converter

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Tesseract OCR
      run: |
        choco install tesseract -y
        echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
    - name: Install Python dependencies
      working-directory: Mouse Convert
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build EXE with PyInstaller
      working-directory: Mouse Convert
      run: |
        pyinstaller --onefile --windowed --name "MouseConverter" --icon=NONE Convert.py
        
    - name: Create Portable Package
      working-directory: Mouse Convert
      run: |
        New-Item -ItemType Directory -Force -Path "Portable\Tesseract-OCR"
        Copy-Item "C:\Program Files\Tesseract-OCR\*" -Destination "Portable\Tesseract-OCR\" -Recurse -Force
        Copy-Item "dist\MouseConverter.exe" -Destination "Portable\" -Force
        
    - name: Create README for portable package
      working-directory: Mouse Convert
      run: |
        @"
        ===================================================
           Mouse Converter - MM to Imperial with OCR
        ===================================================
        
        QUICK START:
        1. Extract this entire folder anywhere
        2. Double-click "MouseConverter.exe"
        3. Look for the cyan "AU" system tray icon
        
        USAGE:
        - Ctrl+Shift + Hover = OCR tooltip conversion
        - Ctrl+Alt+H = History window
        - Double-click history = Batch replace in CDT
        - Right-click history = Restore original
        - Ctrl+Alt+T = Toggle tooltip
        
        Built: $(Get-Date -Format "yyyy-MM-dd HH:mm")
        "@ | Out-File -FilePath "Portable\README.txt" -Encoding utf8
        
    - name: Create ZIP archive
      working-directory: Mouse Convert
      run: |
        Compress-Archive -Path "Portable\*" -DestinationPath "mouse-converter-windows.zip" -Force
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mouse-converter-windows
        path: Mouse Convert/mouse-converter-windows.zip
        retention-days: 90
